name: Offline checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
        go: ['1.26.10', '1.27.3']
        terraform: ['1.11.1', '1.16.6']
    env:
      GOTOOLCHAIN: go${{ matrix.go }}
      MXROUTE_SERVER: ''
      MXROUTE_USERNAME: ''
      MXROUTE_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make check build
  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - run: make vuln
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.11.1'
          terraform_wrapper: false
      - run: make snapshot
      - run: make release-smoke
        env:
          MXROUTE_RELEASE_ARCHIVE: /tmp/mxroute-provider-dist/terraform-provider-mxroute_0.1.0-beta.1-dev_linux_amd64.zip
          MXROUTE_REQUIRE_RELEASE_LIFECYCLE: 'true'
