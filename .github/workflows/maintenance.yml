name: Manual compatibility and public API drift
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_api_drift.py
  offline:
    uses: ./.github/workflows/ci.yml
